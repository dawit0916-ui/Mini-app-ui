<div id="tab-home" class="tab-content active">
<div class="glass p-6 text-center glow-blue mb-6 relative overflow-hidden w-full mx-auto">
    <!-- Ambient glows (matched to header pill's warm gold tone) -->
    <div class="absolute -top-10 -left-10 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-amber-600/10 rounded-full blur-3xl"></div>

    <!-- DASH balance (main) -->
    <div class="mb-4 relative z-10">
        <p class="text-[9px] text-slate-400 uppercase font-black tracking-[0.2em] mb-2">DASH Balance</p>
        <div class="flex items-center justify-center gap-2.5">
            <div class="relative flex-shrink-0">
                <div class="absolute inset-0 bg-amber-500/30 rounded-full blur-md animate-pulse"></div>
                <img src="/assets/images/dash-coin.png" alt="DASH" class="relative w-10 h-10 object-contain drop-shadow-[0_0_8px_rgba(245,158,11,0.5)]">
            </div>
            <h2 id="balance-main" class="text-amber-400 bg-amber-600/10 px-4 py-1.5 rounded-full  text-[24px] font-black tracking-tighter tabular-nums leading-none whitespace-nowrap">0</h2>
        </div>
        <p class="text-orange-400 font-black text-[10px] uppercase tracking-widest mt-2">DASH</p>
    </div>

    <!-- Divider -->
    <div class="flex items-center gap-2 relative z-10">
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-white/10 to-white/5"></div>
        <span class="text-[8px] text-slate-500 uppercase font-black tracking-widest whitespace-nowrap">You can Earn more DASH</span>
        <div class="flex-1 h-px bg-gradient-to-l from-transparent via-white/10 to-white/5"></div>
    </div>
</div>
<!-- Place this inside <div id="tab-home">, above <div id="task-list"> -->
    <div class="category-container mb-4" id="category-bar">
        <button onclick="filterTasks('All', this)" class="category-chip active">All</button>
        <button onclick="filterTasks('Crypto', this)" class="category-chip">Crypto</button>
        <button onclick="filterTasks('Airdrop', this)" class="category-chip">Airdrop</button>
        <button onclick="filterTasks('Education', this)" class="category-chip">Education</button>
    </div>

    <h3 class="text-xs font-black uppercase text-slate-500 tracking-widest mb-4 px-2">Featured Tasks</h3>
    <div id="task-list" class="space-y-4"></div>    
</div>
