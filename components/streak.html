<!-- Streak Claim Modal — hidden by default, shown by JS on app start if claimedToday === false -->
<div id="streak-modal-overlay" class="hidden fixed inset-0 flex items-center justify-center">
    <div class="streak-card">
        <div class="text-center">
            <div class="streak-flame">🔥</div>
            <h3 class="text-xl font-black text-white">Daily Streak</h3>
            <p class="text-xs text-slate-400 mt-1 mb-3">Come back every day for bigger rewards</p>
            <span id="streak-day-chip" class="streak-chip">Day 1 of 7</span>
        </div>

        <!-- populated by JS -->
        <div id="streak-days-grid"></div>

        <button id="streak-claim-btn" onclick="claimStreakReward()" class="streak-claim">
            🎁 Claim Day <span id="streak-claim-day-label">1</span> Reward
        </button>

        <button onclick="closeStreakModal()" class="streak-later">Maybe later</button>
    </div>
</div>
