<!-- REMINDERS TAB -->
<div id="tab-reminders" class="tab-content">
    <!-- Reminder System Toggle -->
    <div class="glass p-6 mb-6 rounded-3xl border border-white/10">
        <div class="flex items-center justify-between gap-4">
            <div>
                <h3 class="text-sm font-black uppercase tracking-widest text-white mb-1">🔔 Reminder System</h3>
                <p class="text-[11px] text-slate-400 uppercase font-bold tracking-wider">Enable welcome message detection</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="remindersToggle" onchange="toggleReminders()">
                <span class="slider"></span>
            </label>
        </div>
        <div id="reminderStatus" class="mt-4 text-[10px] text-slate-500 font-bold uppercase tracking-wider"></div>
    </div>

    <!-- Upload Reminder Image -->
    <div class="glass p-6 mb-6 rounded-3xl border border-white/10">
        <h3 class="text-sm font-black uppercase tracking-widest text-white mb-1">📸 Upload Reminder Image</h3>
        <p class="text-[11px] text-slate-400 uppercase font-bold tracking-wider mb-6">Sent when user deletes welcome message</p>

        <div class="image-upload relative border-2 border-dashed border-white/20 rounded-2xl p-8 text-center hover:border-white/40 transition-all cursor-pointer mb-6" 
     id="imageUpload" 
     ondrop="handleDrop(event)" 
     ondragover="handleDragOver(event)" 
     ondragleave="handleDragLeave(event)"
     onclick="document.getElementById('imageInput').click()">
            <div class="text-4xl mb-3">📷</div>
            <p class="text-[12px] font-black text-purple-400 uppercase tracking-widest mb-2">Drop image or click</p>
            <p class="text-[10px] text-slate-500 uppercase font-bold">PNG, JPG (Max 5MB)</p>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)" class="hidden">
        </div>

        <div class="image-preview hidden mb-6" id="imagePreview">
            <img id="previewImg" src="" alt="Preview" class="w-full max-h-48 object-cover rounded-2xl border border-white/10">
            <p class="mt-3 text-[10px] text-slate-400 font-bold" id="previewText"></p>
        </div>

        <button class="w-full btn-premium py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest" onclick="uploadReminderImage()">
            <span id="uploadBtnText">⬆️ Upload Image</span>
            <span id="uploadBtnLoader" class="loading hidden ml-2"></span>
        </button>
    </div>

    <!-- Reminder Statistics -->
    <div class="glass p-6 mb-6 rounded-3xl border border-white/10">
        <h3 class="text-sm font-black uppercase tracking-widest text-white mb-5">📊 Statistics</h3>
        
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="glass-inner p-4 rounded-2xl border border-white/5 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mb-2">Awaiting</p>
                <div class="text-2xl font-black text-cyan-400" id="awaitingCount">0</div>
            </div>
            <div class="glass-inner p-4 rounded-2xl border border-white/5 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mb-2">Sent</p>
                <div class="text-2xl font-black text-green-400" id="recentCount">0</div>
            </div>
            <div class="glass-inner p-4 rounded-2xl border border-white/5 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mb-2">Status</p>
                <div class="text-2xl font-black" id="systemStatus">🟢</div>
            </div>
        </div>

        <button class="w-full glass py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest text-white border border-white/10 hover:border-white/20 active:scale-95 transition-all"
                onclick="loadReminderStats()">
            🔄 Refresh Stats
        </button>
    </div>

    <!-- Recent Reminder Activity -->
    <div class="glass p-6 rounded-3xl border border-white/10">
        <h3 class="text-sm font-black uppercase tracking-widest text-white mb-4">📜 Recent Activity</h3>
        <div id="recentRemindersContainer" class="space-y-3">
            <p class="text-[10px] text-slate-500 text-center py-6 uppercase font-bold">Loading activity...</p>
        </div>
    </div>
</div>
