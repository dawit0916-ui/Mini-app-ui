<div id="tab-friends" class="tab-content">

<!-- HERO REFERRAL CARD -->
<div class="relative overflow-hidden rounded-3xl mb-5" style="background: linear-gradient(135deg, rgba(124,58,237,0.25) 0%, rgba(79,70,229,0.15) 50%, rgba(249,115,22,0.1) 100%); border: 1px solid rgba(139,92,246,0.25);">
    
    <!-- Background glow -->
    <div class="absolute -top-10 -right-10 w-40 h-40 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-orange-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative p-5">

        <!-- Commission Badge Row -->
        <div class="flex items-center justify-between mb-4">
            <div>
                <h3 class="text-base font-black text-white uppercase tracking-tight">Invite & Earn</h3>
                <p class="text-[9px] text-slate-400 font-bold mt-0.5">Friend completes tasks → you earn </p>
            </div>
            <div class="flex flex-col items-center bg-gradient-to-br from-orange-500 to-amber-600 rounded-2xl px-4 py-2 shadow-lg shadow-orange-500/25">
                <span id="ref-commission-rate" class="text-xl font-black text-white leading-none">10%</span>
                <span class="text-[8px] font-black text-orange-100 uppercase tracking-widest">Commission</span>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="bg-black/30 border border-white/8 rounded-2xl p-3 text-center">
                <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mb-1">Active</p>
                <p id="total-invited" class="text-xl font-black text-white">0</p>
                <p class="text-[8px] text-purple-400 font-bold mt-0.5">Friends</p>
            </div>
            <div class="bg-black/30 border border-orange-500/20 rounded-2xl p-3 text-center">
                <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mb-1">Earned</p>
                <p id="earned-points" class="text-xl font-black text-orange-300">0.00</p>
                <p class="text-[8px] text-orange-600 font-bold mt-0.5">DASH</p>
            </div>
            <div class="bg-black/30 border border-blue-500/20 rounded-2xl p-3 text-center">
                <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mb-1">Required</p>
                <p id="ref-tasks-required" class="text-xl font-black text-blue-400">3</p>
                <p class="text-[8px] text-blue-600 font-bold mt-0.5">Tasks</p>
            </div>
        </div>

        <!-- Referral Link -->
        <div class="bg-black/40 border border-white/8 rounded-2xl p-3 flex items-center gap-2 mb-3">
            <div class="w-7 h-7 bg-blue-500/15 rounded-xl flex items-center justify-center flex-shrink-0">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#60a5fa"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
            </div>
            <input id="ref-link-input" type="text" readonly 
                class="flex-1 bg-transparent text-[10px] text-slate-300 font-mono outline-none min-w-0"
                value="Loading...">
            <button onclick="copyRefLink()" 
                class="flex-shrink-0 bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase text-white active:scale-95 transition-all">
                📋 Copy
            </button>
        </div>

        <!-- Action Buttons -->
        <button onclick="shareInvite()" 
            class="w-full btn-premium py-3.5 rounded-2xl font-black text-sm flex items-center justify-center gap-2 mb-2 active:scale-[0.98] transition-all">
            🚀 Invite Friends
        </button>
        <button onclick="openLeaderboardDrawer('invites')" 
            class="w-full py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition-all"
            style="background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2); color: #fbbf24;">
            🏆 View Invite Leaderboard
        </button>

    </div>
</div>

<!-- TEAM LIST -->
<div class="flex items-center justify-between mb-3 px-1">
    <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Team Progress</h3>
    <span class="text-[9px] text-slate-600 font-bold">3 tasks = active</span>
</div>
<div id="friends-list" class="space-y-3 mb-8"></div>

</div>
