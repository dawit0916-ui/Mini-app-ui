<div id="tab-profile" class="tab-content">
    <!-- Top Balance + Level Card -->
    <div class="glass p-6 text-center glow-blue mb-4 relative overflow-hidden">
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-emerald-600/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-purple-600/10 rounded-full blur-3xl"></div>

        <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mb-1">DASH Balance</p>
        <div class="flex items-center justify-center gap-1.5 mb-4">
            <img src="/assets/images/dash-coin.png" class="w-7 h-7 object-contain">
            <span id="profile-dash" class="text-2xl font-black text-orange-300">0</span>
        </div>
        <div class="flex items-center justify-center gap-1.5 text-[10px] font-bold text-amber-300 mb-3">
        🔥 <span id="profile-streak">0</span>-day streak
        </div>

        <!-- Level Badge -->
        <button onclick="switchTab('levels', document.getElementById('nav-item'))" class="w-full flex items-center gap-3 bg-white/5 hover:bg-white/10 rounded-2xl p-3.5 mb-4 border border-white/10 active:scale-[0.98] transition-all text-left">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500/20 to-indigo-600/20 border border-purple-500/20 flex items-center justify-center text-2xl shrink-0">
                <span id="profile-level-emoji">🆓</span>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider">Level <span id="profile-level-number">0</span></p>
                <p id="profile-level-name" class="text-sm font-black text-white truncate">Free Tier</p>
            </div>
            <span class="text-slate-500 text-lg shrink-0">›</span>
        </button>
        <div class="flex items-center justify-center gap-1.5 text-[9px] font-bold text-cyan-300 mt-1.5">
         🏅 Rank <span id="profile-rank">-</span> · Top <span id="profile-top-percent">-</span>%
        </div>
        <button onclick="openLeaderboardDrawer('points')" class="w-full glass py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 mb-4 border-yellow-500/20 text-yellow-400 active:scale-95 transition-all">
         🏆 View Dash Leaderboard
        </button>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-3 gap-2.5 mb-4">
        <div class="glass p-3.5 rounded-2xl text-center border-orange-500/15">
            <p class="text-base font-black text-orange-300" id="profile-total-earned">0</p>
            <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mt-0.5">Earned</p>
        </div>
        <div class="glass p-3.5 rounded-2xl text-center border-purple-500/15">
            <p class="text-base font-black text-purple-300" id="profile-referrals">0</p>
            <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mt-0.5">Referrals</p>
        </div>
        <div class="glass p-3.5 rounded-2xl text-center border-cyan-500/15">
            <p class="text-base font-black text-cyan-300" id="profile-tasks-done">0</p>
            <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mt-0.5">Tasks Done</p>
        </div>
    </div>
    <button onclick="copyReferralLink()" class="w-full glass py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 mb-4 border-emerald-500/20 text-emerald-400 active:scale-95 transition-all">
      🔗 Copy Referral Link
    </button>

    <!-- User Info Card -->
    <div class="glass p-5 mb-6 border-white/5">
        <div class="flex items-center gap-4 mb-5">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20 overflow-hidden flex-shrink-0">
                <img id="profile-avatar" src="" alt="PFP" class="hidden w-full h-full object-cover">
                <span id="profile-avatar-fallback" class="font-black text-xl uppercase">E</span>
            </div>
            <div class="min-w-0">
                <h3 id="profile-name" class="text-lg font-black text-white truncate">User</h3>
                <p id="profile-username" class="text-xs text-slate-400 truncate"></p>
                <p class="text-[10px] text-slate-500 font-bold mt-0.5">📅 Joined <span id="profile-joined">-</span></p>
            </div>
        </div>

        <div class="bg-white/5 p-3.5 rounded-xl flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
                <span class="text-slate-500 text-xs">>></span>
                <span class="text-[10px] text-slate-400 uppercase font-black tracking-wider">Telegram ID</span>
            </div>
            <div class="flex items-center gap-2">
                <span id="profile-id" class="text-sm font-black text-white">-</span>
                <button onclick="copyProfileTgId()" class="w-6 h-6 rounded-lg bg-white/5 flex items-center justify-center text-[10px] active:scale-90 transition-all">📋</button>
            </div>
        </div>

        <!-- Ban Status Block -->
        <div id="profile-ban-block" class="hidden">

            <!-- BANNED state -->
            <div id="profile-banned-row" class="hidden bg-red-500/10 border border-red-500/30 p-3.5 rounded-xl mb-3">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-base">🚫</span>
                    <span class="text-[10px] text-red-400 uppercase font-black tracking-wider">Account Suspended</span>
                </div>
                <p class="text-[9px] text-red-300/70 leading-relaxed">
                    Your account was suspended by an administrator. Contact support to appeal.
                </p>
            </div>

        </div>
    </div>

    <!-- Contact Support Card -->
    <button onclick="openSupportDrawer()" class="w-full glass p-6 rounded-3xl flex flex-col items-center gap-2 border-white/5 active:scale-[0.98] transition-all">
        <img src="/assets/images/icon-help.png" class="w-12 h-12 object-contain drop-shadow-lg">
        <p class="text-xs font-bold text-slate-400">Having Trouble?</p>
        <p class="text-sm font-black text-white">Contact Support we'll answer</p>
    </button>
</div>
