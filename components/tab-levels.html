<!-- =============== TAB-LEVELS (CONFUSED / EXPERIMENTAL DESIGN) =============== -->
<div id="tab-levels" class="tab-content">
    
    <!-- ===== DISORIENTING HEADER SECTION ===== -->
    <div class="relative mb-8 px-1">
        <!-- Floating Level Number (HUGE, OFFSET) -->
        <div class="absolute -top-12 -right-6 text-[180px] font-black opacity-5 pointer-events-none select-none" id="currentLevelDisplay">1</div>
        
        <!-- Diagonal Layout Info Cards -->
        <div class="relative z-10 space-y-2">
            <!-- Daily Limit Card (Oversized, Misplaced) -->
            <div class="glass p-6 rounded-none rounded-tr-[40px] rounded-bl-[40px] border border-white/10 border-l-transparent">
                <div class="flex items-center justify-between gap-4">
                    <div class="flex-shrink-0">
                        <p class="text-[7px] text-slate-500 uppercase font-black tracking-widest">DAILY</p>
                        <p class="text-[7px] text-slate-500 uppercase font-black tracking-widest">LIMIT</p>
                    </div>
                    <p class="text-5xl font-black text-orange-300 leading-none" id="dailyLimitDisplay">1</p>
                    <div class="text-right flex-1">
                        <p class="text-[8px] text-slate-400 font-black mb-1">Per Day</p>
                        <span id="currentLevelEmoji" class="text-3xl inline-block">🚀</span>
                    </div>
                </div>
            </div>

            <!-- Current Level Name (Positioned Weird) -->
            <div class="glass p-4 rounded-3xl rounded-tl-none border border-white/10 ml-auto w-2/3">
                <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mb-2">You Are</p>
                <p id="currentLevelName" class="text-xl font-black text-purple-400 mb-1">Hustler</p>
                <p class="text-[8px] text-slate-300">Level <span id="currentLevelLevel">1</span></p>
            </div>
        </div>
    </div>

    <!-- ===== UPSIDE DOWN UPGRADE SECTION ===== -->
    <div class="mb-8 pt-6 border-t border-white/10">
        <button onclick="showLevelUpgradeDrawer()" class="w-full glass p-8 rounded-2xl border border-white/10 hover:border-white/30 transition-all group">
            <div class="transform -rotate-12 origin-center mb-3 inline-block">
                <p class="text-4xl">🎁</p>
            </div>
            <p class="text-[9px] text-slate-500 uppercase font-black tracking-wider mb-1">Ready to Level Up?</p>
            <p class="text-xs text-slate-300 font-bold group-hover:text-white transition-colors">Tap anywhere to unlock new powers</p>
        </button>
    </div>

    <!-- ===== CHAOTIC LEVELS DISPLAY (SCATTERED LAYOUT) ===== -->
    <div class="mb-8 relative">
        <h3 class="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-4 px-2">Level Universe</h3>
        
        <!-- Column 1 - Left Aligned -->
        <div class="space-y-3 mb-4">
            <div id="levelsGrid-col1" class="space-y-3">
                <!-- Odd levels: 1, 3, 5, 7, 9 -->
            </div>
        </div>

        <!-- Column 2 - Right Aligned (Offset) -->
        <div class="space-y-3 -mt-8 ml-auto mr-0 w-5/6">
            <div id="levelsGrid-col2" class="space-y-3">
                <!-- Even levels: 2, 4, 6, 8, 10 -->
            </div>
        </div>
    </div>

    <!-- ===== STATS IN WRONG ORDER ===== -->
    <div class="mb-8 grid grid-cols-3 gap-2">
        <div class="glass p-3 rounded-2xl border border-white/10 text-center order-3">
            <p class="text-[7px] text-slate-500 uppercase font-black mb-1">Max Reward</p>
            <p class="text-xl font-black text-green-400">1400</p>
        </div>
        <div class="glass p-3 rounded-2xl border border-white/10 text-center order-1">
            <p class="text-[7px] text-slate-500 uppercase font-black mb-1">Levels</p>
            <p class="text-xl font-black text-purple-400">10</p>
        </div>
        <div class="glass p-3 rounded-2xl border border-white/10 text-center order-2">
            <p class="text-[7px] text-slate-500 uppercase font-black mb-1">Next Cost</p>
            <p class="text-lg font-black text-cyan-400" id="nextLevelPrice">20k</p>
        </div>
    </div>

    <!-- ===== INVERTED LEVEL DETAIL DRAWER ===== -->
    <div id="levelDetailDrawer" class="hidden fixed inset-0 z-50 flex flex-col justify-between">
        <!-- Top Overlay -->
        <div class="bg-black/40 backdrop-blur-sm flex-1 flex items-center justify-center p-4">
            <!-- Floating Center Card -->
            <div class="glass rounded-2xl border border-white/10 w-full max-w-xs overflow-hidden">
                <!-- Header with Emoji on Wrong Side -->
                <div class="bg-gradient-to-r from-purple-600/20 to-cyan-600/20 p-6 flex items-start justify-between border-b border-white/10">
                    <div class="flex-1">
                        <p class="text-[8px] text-slate-500 uppercase font-black tracking-wider mb-2">Level</p>
                        <h3 id="drawerLevelName" class="text-lg font-black uppercase tracking-widest text-purple-400 mb-1">Level 1</h3>
                        <p class="text-[8px] text-slate-400">
                            Cost: <span id="drawerLevelPrice" class="font-black text-cyan-400">10,000</span> DASH
                        </p>
                    </div>
                    <p class="text-5xl" id="drawerLevelEmoji">🚀</p>
                </div>

                <!-- Title Below Header -->
                <div class="p-4 border-b border-white/10">
                    <h2 id="drawerLevelTitle" class="text-2xl font-black text-white mb-1">Hustler</h2>
                    <p id="drawerLevelDesc" class="text-[9px] text-slate-400">Entry Level • Start Your Journey</p>
                </div>

                <!-- Features in Vertical Scroll (Unexpected) -->
                <div class="max-h-40 overflow-x-auto p-4 border-b border-white/10">
                    <div class="flex gap-2">
                        <div id="drawerFeaturesGrid" class="flex gap-2">
                            <!-- Populated dynamically, horizontal scroll -->
                        </div>
                    </div>
                </div>

                <!-- Rewards in Weird Layout -->
                <div class="p-4 space-y-3 border-b border-white/10">
                    <div class="flex items-baseline justify-between gap-3">
                        <p class="text-[8px] text-slate-500 uppercase font-black">Daily Task</p>
                        <p id="drawerDailyReward" class="text-3xl font-black text-orange-300">500</p>
                        <p class="text-[9px] text-slate-400">DASH</p>
                    </div>
                    <div class="flex items-baseline justify-between gap-3">
                        <p class="text-[8px] text-slate-500 uppercase font-black">Limit</p>
                        <p id="drawerDailyLimit" class="text-3xl font-black text-cyan-400">1</p>
                        <p class="text-[9px] text-slate-400">/day</p>
                    </div>
                    <div class="flex items-baseline justify-between gap-3">
                        <p class="text-[8px] text-slate-500 uppercase font-black">Commission</p>
                        <p id="drawerCommission" class="text-3xl font-black text-green-400">5</p>
                        <p class="text-[9px] text-slate-400">%</p>
                    </div>
                </div>

                <!-- Next Level (Prominent, But Rotated Text) -->
                <div class="p-4 border-b border-white/10">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-[8px] text-slate-500 uppercase font-black mb-2">Upgrade to Level 2</p>
                            <p id="drawerNextPrice" class="text-2xl font-black text-transparent bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text">20,000 DASH</p>
                        </div>
                        <p class="text-4xl transform -rotate-45">→</p>
                    </div>
                </div>

                <!-- Buttons Stacked Weird -->
                <div class="p-4 space-y-2">
                    <button id="drawerPurchaseBtn" onclick="processPurchaseLevel()" class="w-full btn-premium py-3 rounded-lg font-black uppercase text-xs transition-all active:scale-[0.98]">
                        🎁 Upgrade Now
                    </button>
                    <button onclick="toggleLevelDetail()" class="w-full glass py-2 rounded-lg font-bold text-[10px] text-slate-300 border border-white/10 active:scale-[0.98] transition-all">
                        Dismiss
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Close Bar -->
        <div class="glass border-t border-white/10 p-3 text-center">
            <button onclick="toggleLevelDetail()" class="text-xl font-black text-slate-400 hover:text-white transition-colors">✕</button>
        </div>
    </div>
</div>

<style>
    /* Confused animations */
    @keyframes wobble {
        0%, 100% { transform: rotate(0deg) skewX(0deg); }
        25% { transform: rotate(2deg) skewX(1deg); }
        50% { transform: rotate(-1deg) skewX(-1deg); }
        75% { transform: rotate(1deg) skewX(0.5deg); }
    }

    @keyframes float-weird {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        33% { transform: translateY(-8px) translateX(-4px); }
        66% { transform: translateY(8px) translateX(4px); }
    }

    @keyframes pulse-uneven {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }

    /* Level card items with chaos */
    .level-card-confused {
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.25rem;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transition: all 0.2s ease;
        cursor: pointer;
        transform: rotate(var(--rotate, 0deg));
    }

    .level-card-confused:hover {
        border-color: rgba(255, 255, 255, 0.2);
        transform: rotate(var(--rotate, 0deg)) scale(1.02);
    }

    .level-card-confused:active {
        transform: rotate(var(--rotate, 0deg)) scale(0.97);
    }

    .level-card-confused.locked {
        opacity: 0.5;
        filter: grayscale(60%);
    }

    .level-card-confused.unlocked {
        animation: pulse-uneven 2s ease-in-out infinite;
    }

    /* Drawer animations */
    #levelDetailDrawer {
        animation: fadeIn 0.25s ease-out;
    }

    #levelDetailDrawer.hidden {
        display: none !important;
        animation: fadeOut 0.2s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    @keyframes fadeOut {
        from {
            opacity: 1;
        }
        to {
            opacity: 0;
        }
    }

    /* Scrollbar for features */
    #drawerFeaturesGrid {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    #drawerFeaturesGrid::-webkit-scrollbar {
        height: 4px;
    }

    #drawerFeaturesGrid::-webkit-scrollbar-track {
        background: transparent;
    }

    #drawerFeaturesGrid::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
    }

    /* Tilted text for Next Level */
    #drawerNextPrice {
        display: inline-block;
    }

    /* Confusing grid breakpoint */
    @media (max-width: 400px) {
        #levelsGrid-col2 {
            width: 100% !important;
            margin-left: 0 !important;
        }
    }
</style>
