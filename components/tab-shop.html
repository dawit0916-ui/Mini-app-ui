<div id="tab-shop" class="tab-content">

    <!-- ===== SHOP HUB (default view) ===== -->
    <div id="shop-section-menu" class="shop-section grid grid-cols-2 gap-3 pb-20">
         <!-- Description -->
    <div class="col-span-2 glass p-4 rounded-2xl border border-white/10 text-center">
        <h2 class="text-sm font-black uppercase text-white mb-1">🛍️ Dash Shop</h2>
        <p class="text-[11px] text-gray-400 leading-relaxed">
            Spend your DASH on courses, APKs, and AI tools. Tap a category below to start, or open My Store to see what you've purchased.
        </p>
    </div>
        <button onclick="switchShopSection('courses')" class="glass p-5 rounded-2xl border border-purple-500/20 flex flex-col items-center gap-2 active:scale-95 transition-all">
            <span class="text-3xl">📚</span>
            <span class="text-xs font-black uppercase text-white">Courses</span>
        </button>
        <button onclick="switchShopSection('apk')" class="glass p-5 rounded-2xl border border-blue-500/20 flex flex-col items-center gap-2 active:scale-95 transition-all">
            <span class="text-3xl">📱</span>
            <span class="text-xs font-black uppercase text-white">APK</span>
        </button>
        <button onclick="switchShopSection('my-purchases')" class="glass p-5 rounded-2xl border border-green-500/20 flex flex-col items-center gap-2 active:scale-95 transition-all">
            <span class="text-3xl">⭐</span>
            <span class="text-xs font-black uppercase text-white">My Store</span>
        </button>
        <button onclick="openImageGenModal()" class="glass p-5 rounded-2xl border border-pink-500/20 flex flex-col items-center gap-2 active:scale-95 transition-all">
            <span class="text-3xl">🎨</span>
            <span class="text-xs font-black uppercase text-white">AI Image</span>
        </button>
    </div>

    <!-- COURSES SECTION -->
    <div id="shop-section-courses" class="shop-section hidden">
        <button onclick="switchShopSection('menu')"
    class="group inline-flex items-center gap-1.5 mb-4 pl-2.5 pr-3.5 py-1.5 rounded-full
           bg-white/5 border border-white/10 backdrop-blur-sm
           text-[11px] font-black uppercase tracking-widest text-slate-300
           transition-all duration-200
           hover:bg-white/10 hover:text-white hover:border-white/20
           active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400/60">
    <span class="text-sm leading-none transition-transform duration-200 group-hover:-translate-x-0.5">←</span>
    Back
</button>
        <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
            <button onclick="filterCourses('all')" class="course-filter-btn active px-3 py-1.5 rounded-full text-[11px] font-black uppercase whitespace-nowrap glass transition-all bg-blue-600/30">All</button>
            <button onclick="filterCourses('tiktok')" class="course-filter-btn px-3 py-1.5 rounded-full text-[11px] font-black uppercase whitespace-nowrap glass transition-all">TikTok</button>
            <button onclick="filterCourses('youtube')" class="course-filter-btn px-3 py-1.5 rounded-full text-[11px] font-black uppercase whitespace-nowrap glass transition-all">YouTube</button>
            <button onclick="filterCourses('dropshipping')" class="course-filter-btn px-3 py-1.5 rounded-full text-[11px] font-black uppercase whitespace-nowrap glass transition-all">Dropship</button>
        </div>
        <div id="shop-courses-grid" class="grid grid-cols-2 gap-3 pb-20">
            <p class="text-center text-slate-500 text-xs py-10 col-span-2">Loading courses...</p>
        </div>
    </div>

    <!-- APK SECTION -->
    <div id="shop-section-apk" class="shop-section hidden">
        <button onclick="switchShopSection('menu')"
    class="group inline-flex items-center gap-1.5 mb-4 pl-2.5 pr-3.5 py-1.5 rounded-full
           bg-white/5 border border-white/10 backdrop-blur-sm
           text-[11px] font-black uppercase tracking-widest text-slate-300
           transition-all duration-200
           hover:bg-white/10 hover:text-white hover:border-white/20
           active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400/60">
    <span class="text-sm leading-none transition-transform duration-200 group-hover:-translate-x-0.5">←</span>
    Back
</button>
        <div id="shop-apk-grid" class="grid grid-cols-2 gap-3 pb-20">
            <p class="text-center text-slate-500 text-xs py-10 col-span-2">Loading APKs...</p>
        </div>
    </div>

    <!-- MY PURCHASES SECTION -->
    <div id="shop-section-my-purchases" class="shop-section hidden">
        <button onclick="switchShopSection('menu')"
    class="group inline-flex items-center gap-1.5 mb-4 pl-2.5 pr-3.5 py-1.5 rounded-full
           bg-white/5 border border-white/10 backdrop-blur-sm
           text-[11px] font-black uppercase tracking-widest text-slate-300
           transition-all duration-200
           hover:bg-white/10 hover:text-white hover:border-white/20
           active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400/60">
    <span class="text-sm leading-none transition-transform duration-200 group-hover:-translate-x-0.5">←</span>
    Back
</button>
        <div id="shop-my-purchases-list" class="space-y-3 pb-20">
            <p class="text-center text-slate-500 text-xs py-10">Loading your purchases...</p>
        </div>
    </div>

</div>
