name: Build Tailwind CSS
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'components/**'
      - 'js/**'
      - 'tw-in.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes tailwindcss@3 -i tw-in.css -o css/tailwind.css --minify --content "./index.html,./components/**/*.html,./js/**/*.js"
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain css/tailwind.css)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add css/tailwind.css
            git commit -m "build: tailwind.css"
            git push
          fi
