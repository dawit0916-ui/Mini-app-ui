name: Build assets and bump version
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'components/**'
      - 'js/**'
      - 'tw-in.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes tailwindcss@3 -i tw-in.css -o css/tailwind.css --minify --content "./index.html,./components/**/*.html,./js/**/*.js"
      - name: Shrink background image (1.9 MB PNG -> ~75 KB WebP)
        run: |
          if [ -f assets/images/bg.png ] && [ ! -f assets/images/bg.webp ]; then
            sudo apt-get install -y webp
            cwebp -q 70 -m 6 assets/images/bg.png -o assets/images/bg.webp
          fi
          if [ -f assets/images/bg.webp ]; then
            sed -i "s#/assets/images/bg\.png#/assets/images/bg.webp#g" css/*.css
          fi
      - name: Shrink icons (about 50 KB -> 8 KB each, only if wider than 128 px)
        run: |
          pip install pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          for f in glob.glob('assets/images/nav-*.webp') + glob.glob('assets/images/icon-*.webp'):
              im = Image.open(f)
              if im.width > 128:
                  h = int(im.height * 128 / im.width)
                  im = im.convert('RGBA').resize((128, h), Image.LANCZOS)
                  im.save(f, 'WEBP', quality=70, method=6)
          PY
      - name: Inline the loading-screen logo (200 px, about 27 KB, saves a 150 KB request)
        run: |
          python3 - <<'PY'
          import base64, io
          from PIL import Image
          src = 'src="/assets/images/dash-coin.webp"'
          h = open('index.html').read()
          if src in h:
              im = Image.open('assets/images/dash-coin.webp').convert('RGBA').resize((200, 200), Image.LANCZOS)
              b = io.BytesIO(); im.save(b, 'WEBP', quality=60, method=6)
              uri = 'data:image/webp;base64,' + base64.b64encode(b.getvalue()).decode()
              h = h.replace(src, 'src="' + uri + '"')
              open('index.html', 'w').write(h)
          PY
      - name: Bump loader version
        run: |
          V=$(date -u +%Y%m%d%H%M%S)
          sed -i -E "s#js/loader\.js\?v=[A-Za-z0-9]+#js/loader.js?v=${V}#" index.html
      - name: Commit if changed
        run: |
          git add -A css assets index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "build: tailwind, images, version"
            git pull --rebase
            git push
          fi
