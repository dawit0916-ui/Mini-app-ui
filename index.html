<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMBT Vault | Premium v2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon-blue: #3b82f6; --neon-red: #ef4444; }
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; padding-bottom: 110px; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-active { color: white !important; filter: drop-shadow(0 0 8px var(--neon-blue)); transform: translateY(-5px); }
        
        /* Three-Dot Menu Overlay */
        #utility-menu { display: none; position: absolute; top: 70px; right: 20px; z-index: 100; width: 180px; }
        .menu-item { padding: 12px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-item:last-child { border: none; }
    </style>
</head>
<body>

    <div class="px-6 pt-6 flex justify-between items-center relative">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-xl font-black shadow-lg" id="user-pfp">D</div>
            <div>
                <h1 id="user-name" class="font-extrabold text-lg">Loading...</h1>
                <span class="text-[10px] text-green-400 uppercase tracking-tighter">● Verified Member</span>
            </div>
        </div>
        
        <button onclick="toggleMenu()" class="w-10 h-10 glass flex items-center justify-center text-xl">⋮</button>
        
        <div id="utility-menu" class="glass shadow-2xl">
            <div class="menu-item" onclick="showModal('history')">📜 Task History</div>
            <div class="menu-item" onclick="showModal('add-task')">➕ Add My Task</div>
            <div class="menu-item" onclick="showModal('help')">❓ Help Support</div>
        </div>
    </div>

    <main class="p-6">
        <div id="tab-home" class="tab-content active">
            <div class="glass p-8 text-center mb-8">
                <p class="text-xs text-slate-400 uppercase tracking-[0.2em] mb-2">Vault Balance</p>
                <h2 id="balance-main" class="text-5xl font-black mb-2">0.00</h2>
                <p class="text-blue-400 font-bold text-sm">USDT</p>
            </div>
            <div id="task-list" class="space-y-4">
                </div>
        </div>

        <div id="tab-admin" class="tab-content">
            <div class="flex items-center gap-2 mb-6 text-red-500 uppercase font-black text-xs tracking-widest">
                <span class="h-1 w-6 bg-red-500"></span> Command Center
            </div>

            <div class="glass p-5 mb-4">
                <button onclick="toggleSection('admin-tasks-form')" class="w-full flex justify-between items-center font-bold text-sm">
                    Manage Tasks <span>⌄</span>
                </button>
                <div id="admin-tasks-form" class="hidden pt-4 space-y-3">
                    <input id="task-title" type="text" placeholder="Task Name" class="w-full bg-slate-900 border-none rounded-xl p-3 text-xs">
                    <input id="task-link" type="text" placeholder="URL Link" class="w-full bg-slate-900 border-none rounded-xl p-3 text-xs">
                    <div class="flex gap-2">
                        <input id="task-reward" type="number" placeholder="Reward (USDT)" class="flex-1 bg-slate-900 border-none rounded-xl p-3 text-xs">
                        <button onclick="addTask()" class="bg-blue-600 px-6 rounded-xl font-bold text-xs">Add</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <button onclick="runSweep()" class="glass p-5 text-center border-orange-500/20">
                    <div class="text-xl mb-1">🧹</div>
                    <p class="text-[10px] font-black uppercase">Run Sweep</p>
                </button>
                <button onclick="toggleSection('bot-settings')" class="glass p-5 text-center">
                    <div class="text-xl mb-1">⚙️</div>
                    <p class="text-[10px] font-black uppercase">Settings</p>
                </button>
            </div>
            
            <div id="bot-settings" class="hidden glass p-5 mb-4">
                <h4 class="text-xs font-bold mb-3">Minimum Withdraw: <span class="text-blue-400">1.0 USDT</span></h4>
                <div class="flex justify-between items-center text-[10px] text-slate-400">
                    <span>Withdrawals Active</span>
                    <input type="checkbox" checked>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 glass flex justify-around items-center px-4 z-50">
        <button onclick="switchTab('home', this)" class="nav-active flex flex-col items-center gap-1">
            <div class="text-2xl">⚡</div><span class="text-[9px] font-bold">VAULT</span>
        </button>
        <button onclick="switchTab('friends', this)" class="text-slate-500 flex flex-col items-center gap-1">
            <div class="text-2xl">👥</div><span class="text-[9px] font-bold">FRIENDS</span>
        </button>
        <button onclick="switchTab('wallet', this)" class="text-slate-500 flex flex-col items-center gap-1">
            <div class="text-2xl">💰</div><span class="text-[9px] font-bold">WALLET</span>
        </button>
        <button id="nav-admin" onclick="switchTab('admin', this)" class="hidden text-red-500/50 flex flex-col items-center gap-1">
            <div class="text-2xl">🔐</div><span class="text-[9px] font-bold">ADMIN</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const RENDER_URL = "https://embt-gateway.onrender.com"; //
        const OWNER_ID = 7329000880; 
        const user = tg.initDataUnsafe?.user || { id: OWNER_ID, username: "Dawit", first_name: "Dawit" };

        function init() {
            document.getElementById('user-name').innerText = user.first_name || user.username;
            if(user.id === OWNER_ID) document.getElementById('nav-admin').classList.remove('hidden');
            tg.expand();
            loadUserData();
        }

        function toggleMenu() {
            const menu = document.getElementById('utility-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('nav-active');
            tg.HapticFeedback.selectionChanged();
        }

        function toggleSection(id) {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        }

        async function runSweep() {
            tg.showConfirm("Run Sweep? This will check if users left groups.", async (ok) => {
                if(ok) {
                    const res = await fetch(`${RENDER_URL}/api/admin/run-sweep`, { method: 'POST' });
                    const data = await res.json();
                    tg.showAlert(data.message);
                }
            });
        }

        async function loadUserData() {
            const res = await fetch(`${RENDER_URL}/api/user/${user.id}`);
            const data = await res.json();
            document.getElementById('balance-main').innerText = data.balance.toFixed(2);
        }

        init();
    </script>
</body>
                </html>
