    <style>.loading-screen-overlay{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:linear-gradient(to bottom,#0d093c 0%,#070b21 50%,#100640 100%);transition:opacity 0.5s ease,visibility 0.5s ease;}.loading-screen-overlay::before{content:'';position:absolute;inset:0;background:transparent;}.loading-screen-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}.loading-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:0 40px;width:100%;max-width:360px;}.loading-logo-ring{width:130px;height:130px;border-radius:50%;border:2px solid rgba(59,130,246,0.4);display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 0 50px rgba(59,130,246,0.3),inset 0 0 30px rgba(59,130,246,0.1);animation:loadingPulse 2.5s ease-in-out infinite;background:radial-gradient(circle,rgba(59,130,246,0.08) 0%,transparent 70%);}.loading-logo-img{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(59,130,246,0.5));}@keyframes loadingPulse{0%,100%{box-shadow:0 0 50px rgba(59,130,246,0.3),inset 0 0 30px rgba(59,130,246,0.1);}50%{box-shadow:0 0 70px rgba(59,130,246,0.5),inset 0 0 40px rgba(59,130,246,0.2);}}.loading-title{font-size:26px;font-weight:900;letter-spacing:0.08em;color:#f8fafc;text-shadow:0 0 20px rgba(59,130,246,0.5);margin-bottom:12px;}.loading-divider{display:flex;align-items:center;gap:8px;margin-bottom:12px;}.loading-dot-deco{width:4px;height:4px;border-radius:50%;background:#3b82f6;}.loading-line-deco{width:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,0.5),transparent);}.loading-tagline{font-size:10px;font-weight:800;letter-spacing:0.25em;color:#64748b;text-transform:uppercase;margin-bottom:36px;}.loading-progress-track{width:100%;height:4px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin-bottom:12px;}.loading-progress-fill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);box-shadow:0 0 12px rgba(59,130,246,0.6);transition:width 0.4s ease;}.loading-status-text{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#64748b;}.loading-tip-card{--tip-bg:#1a0e3f;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.15);width:calc(100% - 80px);max-width:300px;z-index:2;}.loading-tip-loader{display:flex;align-items:center;gap:8px;height:20px;overflow:hidden;}.loading-tip-label{font-size:9px;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;color:#3b82f6;flex-shrink:0;}.loading-tip-words{position:relative;overflow:hidden;flex:1;height:100%;}.loading-tip-words::after{content:"";position:absolute;inset:0;background:linear-gradient( var(--tip-bg) 5%,transparent 25%,transparent 75%,var(--tip-bg) 95% );z-index:2;pointer-events:none;}.loading-tip-word{display:block;height:100%;line-height:20px;font-size:10px;font-weight:600;letter-spacing:0.03em;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:tipSpin 12s infinite;}@keyframes tipSpin{10%{transform:translateY(-102%);}25%{transform:translateY(-100%);}35%{transform:translateY(-202%);}50%{transform:translateY(-200%);}60%{transform:translateY(-302%);}75%{transform:translateY(-300%);}85%{transform:translateY(-402%);}100%{transform:translateY(-400%);}}</style>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
    (function () {
        var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
        var MAX_AGE = 24 * 60 * 60; // keep equal to MAX_AGE_SECONDS on the backend

        var tg = window.Telegram && window.Telegram.WebApp;
        var hasData = !!(tg && tg.initData && tg.initData.length > 0);

        // Real launches carry a fresh auth_date; a copied/old link does not
        var fresh = false;
        try {
            var authDate = Number(new URLSearchParams(tg.initData).get('auth_date'));
            fresh = authDate > 0 && (Date.now() / 1000 - authDate) < MAX_AGE;
        } catch (e) {}

        var hasNativeBridge = typeof window.TelegramWebviewProxy !== 'undefined';
        var inFrame = window.parent && window.parent !== window;

        var insideTMA = hasData && fresh && (hasNativeBridge || inFrame);

        if (!insideTMA && !isLocal) {
            window.__NOT_TMA = true;
            window.stop();                      // halt the parser: loader.js never runs
            location.replace('/fallback.html'); // fallback page -> bot
        }
    })();
</script>

    <!-- Stylesheets are added by script so they never block the first paint.
         The order below is the cascade order. -->
    <script>
    (function () {
        var files = ['base', 'verify-gate', 'streak', 'banner', 'refresh', 'nav', 'marketplace', 'sheets', 'toast', 'popup', 'tasks', 'admin', 'misc', 'imagegen', 'video-player', 'tailwind'];
        files.forEach(function (n) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = 'css/' + n + '.css';
            document.head.appendChild(l);
        });
    })();
    </script>
