<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script> <!-- Required! -->
    <style>
        body { background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); font-family: sans-serif; }
        .balance-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="balance-card">
        <h2>Your Balance</h2>
        <h1 id="user-balance">0.00 USDT</h1>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); // Tells Telegram the app is loaded

        async function fetchData() {
            const userId = tg.initDataUnsafe.user.id; // Gets ID from Telegram
            const res = await fetch(`https://YOUR-RENDER-URL.com/api/user/${userId}`);
            const data = await res.json();
            document.getElementById('user-balance').innerText = data.balance + " USDT";
        }
        fetchData();
    </script>
</body>
</html>
