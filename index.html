    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function () {
            var BOT_URL = 'https://t.me/Dashearn_bot'; // change to your bot
            var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

  var tg = window.Telegram && window.Telegram.WebApp;
  var hasData = !!(tg && tg.initData && tg.initData.length > 0);

  // Android / iOS / Telegram Desktop inject this bridge; a plain browser never has it
  var hasNativeBridge = typeof window.TelegramWebviewProxy !== 'undefined';
  // Telegram Web (webk/webz) runs mini apps inside an iframe
  var inFrame = window.parent && window.parent !== window;

  var insideTMA = hasData && (hasNativeBridge || inFrame);

  if (!insideTMA && !isLocal) {
    window.__NOT_TMA = true;
    document.documentElement.innerHTML =
      '<body style="margin:0;height:100vh;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;background:#05070d;color:#fff;' +
      'font-family:system-ui,sans-serif;text-align:center;padding:24px">' +
      '<h2 style="margin:0 0 8px">Open in Telegram</h2>' +
      '<p style="opacity:.7;margin:0 0 20px">This app only runs inside Telegram.</p>' +
      '<a href="' + BOT_URL + '" style="background:#00e5ff;color:#000;padding:12px 24px;' +
      'border-radius:10px;text-decoration:none;font-weight:600">Open the bot</a></body>';
    setTimeout(function () { location.replace(BOT_URL); }, 1500);
  }
})();
    </script>
