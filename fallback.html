<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dash Earn</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1020">
  <noscript><meta http-equiv="refresh" content="6;url=https://t.me/Dashearn_bot?start"></noscript>
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.12);
      --text: #f2f5ff;
      --muted: #9aa4c7;
      --accent: #2aabee;
      --accent2: #7c5cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      overflow: hidden;
      position: relative;
    }

    .bg {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background:
    linear-gradient(rgba(11,16,32,.6), rgba(11,16,32,.85)),
    url("/assets/images/bg.png") center / cover no-repeat;
}    .blob {
      position: absolute;
      width: 55vmax; height: 55vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .5;
      animation: float 18s ease-in-out infinite alternate;
    }
    .blob.a { background: var(--accent); top: -20vmax; left: -15vmax; }
    .blob.b { background: var(--accent2); bottom: -25vmax; right: -15vmax; animation-delay: -6s; }
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
    }
    @keyframes float {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(6vmax,4vmax) scale(1.15); }
    }

    /* Card */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      text-align: center;
      padding: 36px 28px 30px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      animation: rise .7s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    .logo {
  display: block;
  width: 110px; height: 110px;
  margin: 0 auto 18px;
  object-fit: cover;
  border-radius: 50%;
  filter: drop-shadow(0 10px 26px rgba(80,255,80,.4));
}
    .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 26px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      font-size: 16px; font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn svg { width: 22px; height: 22px; flex: none; }
    .btn.primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 28px rgba(42,171,238,.35);
      margin-bottom: 12px;
    }
    .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(42,171,238,.5); }
    .btn.secondary {
      color: var(--text);
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
    }
    .btn.secondary:hover { background: rgba(255,255,255,.12); transform: translateY(-2px); }
    .btn:active { transform: scale(.98); }

    .features {
      display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
      margin: 0 0 24px;
    }
    .chip {
      font-size: 12px; color: var(--muted);
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
    }

    .status { margin-top: 20px; font-size: 13px; color: var(--muted); min-height: 18px; }
    .status b { color: var(--text); }
    .foot { margin-top: 6px; font-size: 12px; color: #6d7799; }

    @media (prefers-reduced-motion: reduce) {
      .blob, .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="grid"></div>
  </div>

  <main class="card">
    <img class="logo" src="/assets/images/dash-coin.png" alt="Dash Earn logo">

    <h1>Dash <span>Earn</span></h1>
    <p class="tag">Complete tasks, collect rewards, and earn DASH tokens — right inside Telegram.</p>

    <div class="features">
      <span class="chip">✅ Tasks</span>
      <span class="chip">📺 Watch &amp; earn</span>
      <span class="chip">🛍️ Shop</span>
      <span class="chip">👥 Refer friends</span>
      <span class="chip">🏆 Leaderboard</span>
      <span class="chip">🛍️ Shop</span>
    </div>

    <a class="btn primary" id="open" href="https://t.me/Dashearn_bot?start">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.8 15.6l-.4 4.2c.6 0 .9-.3 1.2-.6l2.9-2.7 6 4.4c1.1.6 1.9.3 2.2-1L23.9 4.6c.4-1.6-.6-2.3-1.6-1.9L1.2 10.8c-1.5.6-1.5 1.4-.3 1.8l5.4 1.7L18.900 6.400c.6-.4 1.200-.2.7.2z"/></svg>
      Open in Telegram
    </a>

    <a class="btn secondary" href="https://telegram.org/apps" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
      Download Telegram
    </a>

    <p class="status" id="status">Redirecting to Telegram in <b id="sec">4</b>s…</p>
    <p class="foot">Don't have Telegram? Download it first, then tap Open.</p>
  </main>

  <script>
    (function () {
      var url = "https://t.me/Dashearn_bot?start";
      var left = 10;
      var sec = document.getElementById("sec");
      var status = document.getElementById("status");
      var timer = setInterval(function () {
        left--;
        if (left <= 0) {
          clearInterval(timer);
          status.textContent = "Opening Telegram…";
          window.location.href = url;
        } else {
          sec.textContent = left;
        }
      }, 1000);
      // Cancel auto-redirect if the user taps the download button
      document.querySelector(".btn.secondary").addEventListener("click", function () {
        clearInterval(timer);
        status.textContent = "Install Telegram, then come back and tap Open.";
      });
    })();
  </script>
</body>
</html>
